<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página no encontrada — Epikaizo</title>
<meta name="description" content="La página que buscas no existe. Vuelve al inicio de Epikaizo para cotizar y enviar paquetes o dinero." />
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="notfound" id="main">
  <div class="notfound__inner">
    <p class="notfound__code">404</p>
    <h1 class="notfound__title">Esta página no está en la ruta</h1>
    <p class="notfound__text">El enlace puede haber cambiado o el paquete se extravió. Volvamos al inicio.</p>
    <a class="btn btn--primary" href="/">Ir al inicio</a>
  </div>
</main>
<style>
.notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
.notfound__code { font-family: 'Space Grotesk', sans-serif; font-size: clamp(4rem, 18vw, 9rem); font-weight: 700; color: var(--primary, #0EA5E9); line-height: 1; margin: 0; }
.notfound__title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.4rem, 4vw, 2.2rem); margin: .5rem 0; color: var(--ink, #0F172A); }
.notfound__text { color: #475569; max-width: 40ch; margin: 0 auto 1.5rem; }
</style>
</body>
</html>
