<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epikaizo - Iniciar Sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <style>
    body {
      background: var(--sidebar-bg); /* Dark premium background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: var(--font-body);
    }
    .login-container {
      background: var(--blanco);
      padding: 48px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .login-brand__mark {
      width: 64px;
      height: 64px;
      color: var(--azul-turquesa);
    }
    .login-brand__word {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 28px;
      color: var(--azul-abismo);
      letter-spacing: 0.5px;
    }
    .login-brand__sub {
      font-size: 14px;
      color: var(--texto-suave);
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: left;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--texto-suave);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      padding: 14px 16px;
      border: 1px solid var(--linea);
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 14.5px;
      outline: none;
      transition: all 0.2s ease;
      background: var(--espuma);
    }
    .form-group input:focus {
      border-color: var(--azul-turquesa);
      background: var(--blanco);
      box-shadow: 0 0 0 3px rgba(91,192,190,0.15);
    }
    .login-btn {
      margin-top: 10px;
      width: 100%;
      justify-content: center;
      padding: 14px;
      font-size: 15px;
    }
    .login-error {
      color: var(--rojo);
      font-size: 13px;
      margin-top: -10px;
      display: none;
      text-align: center;
      font-weight: 500;
    }
    .demo-credentials {
      margin-top: 32px;
      padding: 16px;
      background: var(--espuma);
      border-radius: 8px;
      font-size: 12px;
      color: var(--texto-suave);
      text-align: left;
    }
    .demo-credentials strong { color: var(--azul-abismo); display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-brand">
      <svg class="login-brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
      <div class="login-brand__word">EPIKAIZO</div>
      <div class="login-brand__sub">Portal de Administración</div>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="admin@epikaizo.com">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <div id="loginError" class="login-error">Credenciales incorrectas.</div>
      <button type="submit" class="btn btn--primary login-btn">Iniciar Sesión</button>
    </form>

    <div class="demo-credentials">
      <strong>Credenciales Demo:</strong>
      Super Admin: <em>admin@epikaizo.com / admin123</em><br>
      Admin Bata: <em>bata@epikaizo.com / bata123</em><br>
      Admin Malabo: <em>malabo@epikaizo.com / malabo123</em>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
