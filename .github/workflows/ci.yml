name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epk
          POSTGRES_PASSWORD: epk
          POSTGRES_DB: epikaizo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U epk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Comprobar sintaxis del panel y la web
        run: for f in $(find ../public/js -name '*.js'); do node --experimental-default-type=module --check "$f"; done
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://epk:epk@localhost:5432/epikaizo_test
